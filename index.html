<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLL Challenge Score App by Crefus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UD+Gothic&display=swap" rel="stylesheet">
</head><body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <h1><span class="logo-blue">F</span><span class="logo-red">L</span><span class="logo-blue">L</span> Challenge Score App by Crefus</h1>
                <div class="device-toggle-group" role="group" aria-label="表示デバイスの切り替え">
                    <button id="device-smartphone" class="device-btn" title="スマートフォン表示">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                    </button>
                    <button id="device-tablet" class="device-btn" title="タブレット表示">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2" ry="2"></rect><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </button>
                    <button id="device-pc" class="device-btn active" title="PC表示">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="12" rx="2"></rect><line x1="12" y1="15" x2="12" y2="21"></line><line x1="8" y1="21" x2="16" y2="21"></line></svg>
                    </button>
                </div>
            </div>
            <nav class="tab-bar">
                <button id="timerTab" class="tab-button active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>ストップウォッチ</span>
                </button>
                <button id="scoreTab" class="tab-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><polyline points="9 11 11 13 15 9"></polyline></svg>
                    <span>スコア集計</span>
                </button>
                <button id="historyTab" class="tab-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"></path><path d="M12 2a6 6 0 0 0-6 6v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V8a6 6 0 0 0-6-6z"></path></svg>
                    <span>結果</span>
                </button>
            </nav>
        </header>

    <main>
        <section id="timer-section" class="content active">
            <h2>ストップウォッチ</h2>
            <div class="timer-display">
                <canvas id="timer-circle" width="250" height="250"></canvas>
                <div id="time-text">
                    <input type="number" id="minutes-input" value="2" min="0" max="99">
                    :
                    <input type="number" id="seconds-input" value="30" min="0" max="59">.<span id="centiseconds-display">00</span>
                </div>
            </div>
            <div class="timer-controls">
                <button id="startStopButton">スタート</button>
                <button id="exchangeButton" disabled>交換</button>
                <button id="resetButton">リセット</button>
            </div>
            <div class="lap-summary-container">
                <table id="total-times-table">
                    <tbody>
                        <tr class="total-run-row">
                            <th>Run 合計</th>
                            <td><span id="total-run-time">0.00</span> 秒</td>
                        </tr>
                        <tr class="total-exchange-row">
                            <th>交換 合計</th>
                            <td><span id="total-exchange-time">0.00</span> 秒</td>
                        </tr>
                    </tbody>
                </table>
                <ul id="lap-times">
                </ul>
            </div>
        </section>

        <section id="score-section" class="content">
            <div class="score-form" id="missions-container">
                <!-- Missions will be loaded dynamically from missions.md -->
            </div>

            <div class="score-footer">
                <div class="score-footer-content">
                    <div class="total-score">
                        <h3>合計点数: <span id="total-score-value">0</span>点</h3>
                    </div>
                    <div class="score-footer-buttons">
                        <button id="scoreResetButton" class="score-reset-button">リセット</button>
                        <button id="saveScoreButton" class="score-save-button">保存</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="history-section" class="content">
            <h2>結果</h2>
            <div class="saved-scores-container">
                <ul id="score-history-list"></ul>
                <button id="downloadButton" class="download-button">履歴をCSVでダウンロード</button>
            </div>
        </section>
    </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
