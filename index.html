<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLL Challenge Score App by Crefus</title>
    <link rel="stylesheet" href="style.css?v=1.0.5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UD+Gothic&display=swap" rel="stylesheet">
</head><body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <h1><span class="logo-blue">F</span><span class="logo-red">L</span><span class="logo-blue">L</span> Challenge Score App by Crefus</h1>
                <span class="header-version">ver2.0</span>
            </div>
            <nav class="tab-bar">
                <button id="timerTab" class="tab-button active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>ストップウォッチ</span>
                </button>
                <button id="cameraTab" class="tab-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    <span>カメラ</span>
                </button>
                <button id="scoreTab" class="tab-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><polyline points="9 11 11 13 15 9"></polyline></svg>
                    <span>スコア集計</span>
                </button>
                <button id="futureTab" class="edition-link edition-link-future">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><polyline points="9 11 11 13 15 9"></polyline></svg>
                    <span>Future</span>
                </button>
                <button id="foundersTab" class="edition-link edition-link-founders">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><polyline points="9 11 11 13 15 9"></polyline></svg>
                    <span>Founders</span>
                </button>
                <button id="historyTab" class="tab-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"></path><path d="M12 2a6 6 0 0 0-6 6v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V8a6 6 0 0 0-6-6z"></path></svg>
                    <span>結果</span>
                </button>
            </nav>
        </header>

        <button id="headerToggleBtn" class="header-toggle-btn" aria-label="ヘッダー切り替え">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon"><polyline points="18 15 12 9 6 15"/></svg>
        </button>

    <main>
        <section id="timer-section" class="content active">
            <h2>ストップウォッチ</h2>
            <div class="timer-display">
                <canvas id="timer-circle" width="300" height="300"></canvas>
                <div id="time-text">
                    <input type="number" id="minutes-input" value="2" min="0" max="99">
                    :
                    <input type="number" id="seconds-input" value="30" min="0" max="59">.<span id="centiseconds-display">00</span>
                </div>
            </div>
            <div class="timer-controls">
                <button id="startStopButton">スタート</button>
                <button id="exchangeButton" disabled>交換</button>
                <button id="resetButton">リセット</button>
            </div>
            <div class="lap-summary-container">
                <table id="total-times-table">
                    <tbody>
                        <tr class="total-run-row">
                            <th>Run 合計</th>
                            <td><span id="total-run-time">0.00</span> 秒</td>
                        </tr>
                        <tr class="total-exchange-row">
                            <th>交換 合計</th>
                            <td><span id="total-exchange-time">0.00</span> 秒</td>
                        </tr>
                    </tbody>
                </table>
                <ul id="lap-times">
                </ul>
            </div>
        </section>

        <section id="camera-section" class="content cam-fullscreen">
            <!-- Landscape-only warning overlay -->
            <div class="cam-orientation-warning" id="camOrientationWarning">
                <div class="cam-orientation-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                        <line x1="12" y1="18" x2="12.01" y2="18"/>
                    </svg>
                </div>
                <p>📱 横向きにしてください</p>
            </div>

            <!-- Full-screen video background -->
            <video id="camera-stream" autoplay playsinline muted></video>

            <!-- Recording indicator -->
            <div class="cam-rec-indicator" id="camRecIndicator">
                <span class="cam-rec-dot"></span>
                <span>REC</span>
            </div>

            <!-- Top-left info overlay -->
            <div class="cam-top-info-overlay">
                <div class="cam-top-info-row cam-top-remaining">残り <strong id="camTimelineRemaining">2:30</strong></div>
                <div class="cam-top-info-row cam-top-run">Run合計 <strong id="camTimelineRunTotal">0.0</strong>秒</div>
                <div class="cam-top-info-row cam-top-exchange">交換合計 <strong id="camTimelineExchangeTotal">0.0</strong>秒</div>
            </div>

            <!-- Camera selector (top-right) -->
            <div class="cam-selector-overlay">
                <select id="camera-select" class="cam-glass-select">
                    <option value="">カメラ読み込み中...</option>
                </select>
            </div>

            <!-- Right-side round control buttons -->
            <div class="cam-controls-col">
                <!-- Record button -->
                <button id="camRecordButton" class="cam-round-btn cam-btn-record" title="録画">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
                </button>
                <div class="cam-btn-label">録画</div>

                <!-- Start/Stop button -->
                <button id="camStartStopButton" class="cam-round-btn cam-btn-start" title="スタート">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <div class="cam-btn-label" id="camStartLabel">スタート</div>

                <!-- Exchange button -->
                <button id="camExchangeButton" class="cam-round-btn cam-btn-exchange" title="交換" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
                <div class="cam-btn-label" id="camExchangeLabel">交換</div>

                <!-- Reset button -->
                <button id="camResetButton" class="cam-round-btn cam-btn-reset" title="リセット">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.49"/></svg>
                </button>
                <div class="cam-btn-label">リセット</div>
            </div>

            <!-- Timeline toggle tabs (shadcn/Radix style) -->
            <div class="cam-tab-switcher" id="camTabSwitcher">
                <div class="cam-tab-list" role="tablist" aria-label="タイムライン設定">
                    <button class="cam-tab-trigger active" id="camTabOn" role="tab" data-state="active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="3" rx="1"/><rect x="3" y="10" width="12" height="3" rx="1"/><rect x="3" y="17" width="7" height="3" rx="1"/></svg>
                        バーあり
                    </button>
                    <button class="cam-tab-trigger" id="camTabOff" role="tab" data-state="inactive">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        バーなし
                    </button>
                </div>
            </div>

            <!-- Bottom timeline bar -->
            <div class="cam-timeline-wrapper" id="camTimelineWrapper">
                <div class="cam-timeline-track" id="camTimelineTrack">
                    <!-- Filled segments rendered by JS -->
                </div>
            </div>
        </section>

        <section id="score-section" class="content">
            <div class="score-form" id="missions-container">
                <!-- Missions will be loaded dynamically from missions.md -->
            </div>

            <div class="score-footer">
                <div class="score-footer-content">
                    <div class="total-score">
                        <h3>合計点数: <span id="total-score-value">0</span>点</h3>
                    </div>
                    <div class="score-footer-buttons">
                        <button id="scoreResetButton" class="score-reset-button">リセット</button>
                        <button id="saveScoreButton" class="score-save-button">保存</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="future-section" class="content edition-content">
            <iframe id="futureFrame" class="edition-frame" data-src="Future%20Score%20BIOGLOW/index.html" title="BIOGLOW Future Edition 得点計算"></iframe>
        </section>

        <section id="founders-section" class="content edition-content">
            <iframe id="foundersFrame" class="edition-frame" data-src="Founders%20Score%20BIOGLOW/index.html" title="BIOGLOW Founders Edition 得点計算"></iframe>
        </section>

        <section id="history-section" class="content">
            <h2>結果</h2>
            <div class="saved-scores-container">
                <ul id="score-history-list"></ul>
                <button id="downloadButton" class="download-button">履歴をCSVでダウンロード</button>
            </div>
        </section>
    </main>
    </div>

    <script src="script.js?v=1.0.5"></script>
</body>
</html>
